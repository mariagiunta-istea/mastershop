<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopApp</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
      <a class="navbar-brand fw-bold" href="#">ShopApp</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto" id="category-nav">
          <!-- categorías dinámicas — Persona 4 -->
        </ul>

        <div class="d-flex align-items-center gap-3">
          <input type="search" id="search-input" class="form-control form-control-sm" placeholder="Buscar productos..."
            style="width: 200px;" />

          <!-- botón disparador del carrito -->

          <button class="btn btn-outline-light position-relative" id="cart-btn" type="button" data-bs-toggle="offcanvas"
            data-bs-target="#cart-sidebar" aria-controls="cart-sidebar">

            <!-- icono de carrito -->
            <i class="bi bi-cart3 fs-5"></i>

          <!-- badge rojo indicador de cantidad productos sobre botón disparador del carrito -->
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"
              id="cart-badge">
              0
            </span>

          </button>


        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <section>
      <h2 class="mb-4 text-center section-title">Nuestros Productos</h2>
      <div class="row g-4" id="products-container">
        <!-- cards dinámicas — products.js -->
      </div>
    </section>
  </main>

  <!-- Modal detalle producto — Persona 2 -->
  <div class="modal fade" id="product-modal" tabindex="-1" aria-labelledby="product-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="product-modal-label"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="modal-body-content">
          <!-- contenido dinámico -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="add-to-cart-btn">
            <i class="bi bi-cart-plus me-1"></i>Agregar al carrito
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Aquí se renderiza el carrito-->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="cart-sidebar" aria-labelledby="cart-sidebar-label">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="cart-sidebar-label">
        <i class="bi bi-cart3 me-2"></i>Mi carrito
      </h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="cart-items-list" class="flex-grow-1">
        <!-- productos del carrito -->
      </div>
      <div id="cart-actions" class="mt-3 d-flex flex-column gap-2">

        <div class="border-top pt-3 mt-3">
          <h5 class="d-flex justify-content-between">
            <span>Total:</span>
            <span id="cart-total">$0.00</span>
          </h5>
        </div>

        <!-- botones de finalizar compra y eliminar todos del carrito -->
        <button class="btn btn-success" id="checkout-btn">
          <i class="bi bi-bag-check me-1"></i>Finalizar compra
        </button>
        <button class="btn btn-outline-danger" id="clear-cart-btn">
          <i class="bi bi-trash me-1"></i>Eliminar todos
        </button>
      </div>
    </div>
  </div>

  <footer class="bg-primary text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; 2025 ShopApp — Laboratorio de Aplicaciones Web</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/api.js"></script>
  <script src="js/products.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/filter.js"></script>
</body>

</html>
